function audioInit(){
 if(eng||!AC)return;
 try{const a=AC;

/* ---------- loop & input ---------- */
let last=0;
let avgDt=.016,qn=0;
function frame(ts){
 const raw=(ts-last)/1000||0;const dt=Math.min(.05,raw);last=ts;
 if(raw>0&&raw<.5){avgDt=avgDt*.93+raw*.07;qn++;if(qn>90&&avgDt>.027&&STEP<4){STEP++;qn=0;avgDt=.02;}}
if(state==='cine'){G.cine.t+=dt;const sc=G.cine.s;const li=Math.floor((G.cine.t-.5)/1.9);if(G.cine.t>.5&&li>=0&&li<sc.lines.length&&G.cine.lastLi!==li){G.cine.lastLi=li;tone(300+li*90,.09,'square',.07);}if(G.cine.t>.5+sc.lines.length*1.9+1.1)endCine();}
 if(state==='play')update(G.rush&&G.slow>0?dt*.4:dt);
 if(state==='play'){let m=0;if(G.train){m=clamp(1-Math.abs(G.train.W+180-G.dist*10)/900,0,1);}audioUpdate(G.v,true,m);}else audioUpdate(0,false,0);
 render();requestAnimationFrame(frame);
}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*LW,y:(e.clientY-r.top)/r.height*LH};}

let holdDir=0,ptr=null;
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();const p=pos(e);ac();
 if(p.x>LW-56&&p.y<56){muted=!muted;return;}
 if(state==='menu'){for(const b of MB){if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){
   if(b.id==='day'){festMode=b.v;saveAll();}else if(b.id==='rush')startRush();else if(b.id==='story')startCards();
   else if(b.id==='ride'){const r=RIDES[b.i];if(own[r.k]){selVeh=r.k;}else if(coinsTotal>=r.cost){coinsTotal-=r.cost;own[r.k]=1;selVeh=r.k;if(r.k==='auto')unlockedAuto=true;saveAll();menuMsg='Unlocked '+r.n+'!';menuMsgT=performance.now()+2000;}else{menuMsg='Need '+(r.cost-coinsTotal)+' more coins — play Rush Hour!';menuMsgT=performance.now()+2200;}}
   break;}}}
 else if(state==='cine'){if(G.cine.t>.8)endCine();}
 else if(state==='choice'){for(let i=0;i<BTN.length;i++){const b=BTN[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){pickOpt(i);break;}}}
 else if(state==='win'||state==='lose'){
  if(G.rush){if(p.y>=510&&p.y<=550&&p.x>=30&&p.x<=200)doCopy();else if(p.y>=510&&p.y<=550&&p.x>=220&&p.x<=390)state='menu';else if(performance.now()-endAt>400)startRush();}
  else if(p.x>=110&&p.x<=310&&p.y>=510&&p.y<=554)doCopy();
  else if(performance.now()-endAt>700)startCards();
 }else if(state==='play'){if(Math.hypot(p.x-LW/2,p.y-(LH-62))<46){brakeId=e.pointerId;return;}ptr={id:e.pointerId,x0:p.x,t0:G.tx,moved:false,side:p.x<LW/2?-1:1};holdDir=ptr.side;}
},{passive:false});
cv.addEventListener('pointermove',e=>{if(state==='play'&&ptr&&e.pointerId===ptr.id){const dx=pos(e).x-ptr.x0;if(!ptr.moved&&Math.abs(dx)>12){ptr.moved=true;holdDir=0;ptr.t0=G.tx;ptr.x0=pos(e).x;}if(ptr.moved)G.tx=clamp(ptr.t0+(pos(e).x-ptr.x0)*1.6,G.rl+22,G.rr-22);}});
const endPtr=e=>{if(e&&e.pointerId===brakeId){brakeId=null;return;}if(!e||!ptr||e.pointerId===ptr.id){ptr=null;holdDir=0;}};
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);
addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')keys.l=1;if(e.key==='ArrowRight'||e.key==='d')keys.r=1;if(e.key==='ArrowDown'||e.key==='s'||e.key==='Shift')keys.b=1;

});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=0;if(e.key==='ArrowRight'||e.key==='d')keys.r=0;if(e.key==='ArrowDown'||e.key==='s'||e.key==='Shift')keys.b=0;});
window.__dto={endCine,startCine,startRush,update,render,startCards,pickOpt,get G(){return G;},get state(){return state;}};
requestAnimationFrame(frame);
})();
